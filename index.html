    /** Open print-ready formatted GST Tax Invoice matching user's exact Tally layout */
    function printInvoice(inv, isPreviewOnly = false) {
      const fileName = getInvoiceFileName(inv);
      const printHtml = generateInvoiceHtml(inv, fileName);

      // If user clicked Preview / View, open in a new tab so they can review the invoice
      if (isPreviewOnly) {
        const previewWindow = window.open('', '_blank');
        if (previewWindow) {
          previewWindow.document.open();
          previewWindow.document.write(printHtml);
          previewWindow.document.close();
        } else {
          notify('Pop-up blocked. Please allow pop-ups to preview invoices.');
        }
        return;
      }

      // Temporarily update document.title of main window and iframe so Chrome/Edge
      // automatically suggests "INV - [No] - [Party], [City].pdf" in the Save as PDF dialog
      const originalTitle = document.title;
      document.title = fileName;

      const existingFrame = document.getElementById('__print_iframe__');
      if (existingFrame) existingFrame.remove();

      const iframe = document.createElement('iframe');
      iframe.id = '__print_iframe__';
      iframe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;border:0;opacity:0;pointer-events:none;';
      document.body.appendChild(iframe);

      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(printHtml);
      doc.close();
      if (doc) doc.title = fileName;

      const restore = () => {
        document.title = originalTitle;
        try { iframe.remove(); } catch (e) {}
        window.removeEventListener('afterprint', restore);
      };
      window.addEventListener('afterprint', restore);

      // Give browser time to parse fonts/CSS, then invoke native print dialog
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        // Fallback cleanup after print dialog is closed
        setTimeout(restore, 2500);
      }, 350);
    }

    /** Load jsPDF on demand (used to write a real text PDF, not a picture). */
    async function loadHtml2Pdf() {
      const ready = () => window.jspdf && typeof window.jspdf.jsPDF === 'function';
      if (ready()) return true;
      try {
        await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'jspdf-cdn');
        return ready();
      } catch (err) {
        console.warn('PDF library could not be loaded.', err);
        return false;
      }
    }

    /** Inter font files (they include the rupee sign). Cached after the first download. */
    let _pdfFontCache = null;
    async function loadPdfFonts() {
      if (_pdfFontCache) return _pdfFontCache;
      const toB64 = buf => {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(bin);
      };
      try {
        const base = 'https://cdn.jsdelivr.net/npm/@expo-google-fonts/inter@0.2.3/';
        const get = f => fetch(base + f).then(x => { if (!x.ok) throw new Error('font'); return x.arrayBuffer(); });
        const [r, b] = await Promise.all([get('Inter_400Regular.ttf'), get('Inter_700Bold.ttf')]);
        _pdfFontCache = { fontRegularB64: toB64(r), fontBoldB64: toB64(b) };
        try { _pdfFontCache.fontSemiB64 = toB64(await get('Inter_600SemiBold.ttf')); } catch (e) { /* optional weight */ }
        // Italic face for the CGST / SGST / Cartage & Forwarding / Round Off labels (same as the print layout)
        try {
          const ib = await fetch('https://cdn.jsdelivr.net/npm/@expo-google-fonts/inter@0.4.2/400Regular_Italic/Inter_400Regular_Italic.ttf')
            .then(x => { if (!x.ok) throw new Error('font'); return x.arrayBuffer(); });
          _pdfFontCache.fontItalicB64 = toB64(ib);
        } catch (e) { /* falls back to a slanted standard font */ }
      } catch (err) {
        console.warn('Invoice font unavailable; using the built-in PDF font.', err);
        return {};
      }
      return _pdfFontCache;
    }

    /** Turn the saved logo into a PNG data URL that jsPDF can embed. */
    function prepareLogoForPdf(src, whiteBackground = false) {
      return new Promise(resolve => {
        const safe = safeImageSrc(src);
        if (!safe) return resolve({});
        const img = new Image();
        img.onload = () => {
          try {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth || 1; c.height = img.naturalHeight || 1;
            const g = c.getContext('2d');
            if (whiteBackground) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
            g.drawImage(img, 0, 0);
            resolve({ logoDataUrl: c.toDataURL('image/png'), logoW: c.width, logoH: c.height });
          } catch (e) { resolve({}); }
        };
        img.onerror = () => resolve({});
        img.src = safe;
      });
    }

    /* Draws the GST tax invoice as a real text PDF (selectable / copyable text) with jsPDF.
       Sizes follow the print layout (CSS px x 0.75 = pt) so the PDF looks like the print preview. */
    async function buildInvoiceTextPdf(inv, s, H) {
      const { jsPDF, num, round2, moneyRaw, titleCase, fmtTallyDate, codeFor, numberWordsINR, supplierAddressLines, supplierContactLine } = H;
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });

      // ---- fonts: Inter (same family as the print layout; has the rupee sign), otherwise built-in Helvetica ----
      let FONT = 'helvetica';
      let RS = 'Rs. ';
      const FACE = { r: 'Inter', s: 'InterSemi', b: 'InterBold' };
      if (H.fontRegularB64 && H.fontBoldB64) {
        try {
          doc.addFileToVFS('Inter-Regular.ttf', H.fontRegularB64);
          doc.addFont('Inter-Regular.ttf', 'Inter', 'normal', 400, 'Identity-H');
          doc.addFileToVFS('Inter-Bold.ttf', H.fontBoldB64);
          doc.addFont('Inter-Bold.ttf', 'InterBold', 'normal', 400, 'Identity-H');
          if (H.fontSemiB64) {
            doc.addFileToVFS('Inter-SemiBold.ttf', H.fontSemiB64);
            doc.addFont('Inter-SemiBold.ttf', 'InterSemi', 'normal', 400, 'Identity-H');
          } else {
            FACE.s = 'InterBold';
          }
          if (H.fontItalicB64) {
            doc.addFileToVFS('Inter-Italic.ttf', H.fontItalicB64);
            doc.addFont('Inter-Italic.ttf', 'InterItalic', 'normal', 400, 'Identity-H');
            FACE.i = 'InterItalic';
          }
          FONT = 'Inter';
          RS = '₹';
        } catch (e) { FONT = 'helvetica'; RS = 'Rs. '; }
      }

      const LW = 0.22; // line width in mm
      doc.setLineWidth(LW);
      doc.setDrawColor(0);
      doc.setTextColor(0);

      // weight: 'r' regular, 's' semibold (600), 'b' bold (700), 'i' italic; true/false still accepted
      const font = (w, size) => {
        const k = w === true ? 'b' : (w === false || w === undefined) ? 'r' : w;
        if (FONT === 'Inter') doc.setFont(FACE[k] || 'Inter', 'normal');
        else doc.setFont('helvetica', k === 'i' ? 'italic' : (k === 'b' || k === 's') ? 'bold' : 'normal');
        doc.setFontSize(size);
      };
      const text = (str, x, y, o = {}) => doc.text(String(str ?? ''), x, y, o);
      const ln = (x1, y1, x2, y2) => doc.line(x1, y1, x2, y2);
      const wrap = (str, w) => doc.splitTextToSize(String(str ?? ''), w);
      const PT = 0.3528;
      /** baseline for text of size `pt` vertically centred in a line box starting at `top` with height `lh` (mm) */
      const base = (top, lh, pt) => top + lh / 2 + 0.36 * pt * PT;

      // ---- geometry (mm) ----
      const X0 = 7, W = 196, X1 = X0 + W;
      const SHEET_TOP = 13, SHEET_BOTTOM = 288;
      const LEFT_W = 100;
      const SUP_TEXT_X = X0 + 27;
      const SUP_TEXT_W = (X0 + LEFT_W) - SUP_TEXT_X - 2;
      const SZ = { name: 14.25, sup: 9.4, buyerName: 12, buyerLine: 10.5, buyerState: 9 };
      const LH = { name: 5.8, sup: 4.0 };
      // supplier block lines (name, contact, full address, GSTIN, state) decide how tall the top block is
      font('b', SZ.name);
      const supNameLines = wrap(String(s.businessName || 'ROYAL SANITATION').toUpperCase(), SUP_TEXT_W).slice(0, 2);
      font('s', SZ.sup);
      const supContact = supplierContactLine ? supplierContactLine(s) : '';
      const supContactLines = supContact ? wrap(supContact, SUP_TEXT_W).slice(0, 2) : [];
      font('b', SZ.sup);
      const supAddrLines = (supplierAddressLines ? supplierAddressLines(s) : []).flatMap(l => wrap(l, SUP_TEXT_W)).slice(0, 6);
      const SUP_CONTENT_H = supNameLines.length * LH.name + (supContactLines.length + supAddrLines.length + 2) * LH.sup;
      const SUP_H = Math.max(24, SUP_CONTENT_H + 4);
      const BUYER_H = 25.5;
      const TOP_H = SUP_H + BUYER_H;   // supplier/buyer + meta block
      const HEAD_H = 8.4;          // items table header
      const ITEM_H = 4.65;         // one item row
      const TOTAL_H = 5.0;         // items "Total" row
      const TAX_ROW_H = 4.0;
      const WORDS_H = 7.6;
      const BOTTOM_H = 46;
      const TAXWORDS_H = 4.4;

      const placeOfSupply = inv.state || inv.placeOfSupply || 'Maharashtra';
      const isIntra = placeOfSupply === 'Madhya Pradesh';
      const items = inv.items || [];

      // ---- items table columns ----
      const colW = [8, 72, 18, 22, 20, 13, 19, 24];
      const colX = [X0];
      colW.forEach((w, i) => colX.push(colX[i] + w));
      const DESC_W = colW[1] - 3;

      // ---- build row list ----
      const rows = [];
      font('b', 9);
      items.forEach((it, idx) => {
        const lines = wrap(titleCase(it.description), DESC_W);
        rows.push({ kind: 'item', it, idx, lines, h: Math.max(ITEM_H, lines.length * 3.7 + 1.0) });
      });
      const gstRate = num((items[0] && items[0].gstRate) || 18);
      if (!isIntra) {
        rows.push({ kind: 'tax', label: 'IGST', rate: gstRate + ' %', amt: moneyRaw(inv.totalGst), h: TAX_ROW_H });
      } else {
        rows.push({ kind: 'tax', label: 'CGST', rate: (gstRate / 2) + ' %', amt: moneyRaw(inv.cgst), h: TAX_ROW_H });
        rows.push({ kind: 'tax', label: 'SGST', rate: (gstRate / 2) + ' %', amt: moneyRaw(inv.sgst), h: TAX_ROW_H });
      }
      if (inv.discountMode === 'after' && num(inv.discount) > 0) {
        rows.push({ kind: 'tax', label: 'Discount', rate: '', amt: '-' + moneyRaw(inv.discount), h: TAX_ROW_H });
      }
      if (num(inv.otherCharges) > 0) {
        rows.push({ kind: 'tax', label: 'Cartage & Forwarding', rate: '', amt: moneyRaw(inv.otherCharges), h: TAX_ROW_H });
      }
      if (num(inv.roundOff) !== 0) {
        rows.push({ kind: 'tax', label: 'Round Off', rate: '', amt: (inv.roundOff >= 0 ? '+' : '') + moneyRaw(inv.roundOff), h: TAX_ROW_H });
      }

      // ---- HSN grouping ----
      const hsnMap = {};
      items.forEach(it => {
        const code = it.hsn || '—';
        if (!hsnMap[code]) hsnMap[code] = { hsn: code, taxable: 0, gstRate: num(it.gstRate), cgst: 0, sgst: 0, igst: 0, totalTax: 0 };
        hsnMap[code].taxable += num(it.taxable);
        hsnMap[code].cgst += num(it.cgst);
        hsnMap[code].sgst += num(it.sgst);
        hsnMap[code].igst += num(it.igst);
        hsnMap[code].totalTax += num(it.gst);
      });
      const hsnList = Object.values(hsnMap);
      const HSN_ROW_H = 4.5;
      const HSN_HEAD_H = 7.0;
      const hsnTableH = HSN_HEAD_H + HSN_ROW_H * (hsnList.length + 1);
      const TAIL_H = WORDS_H + hsnTableH + TAXWORDS_H + BOTTOM_H;

      // ---- drawing helpers ----
      function drawFrame(top, title) {
        font('b', 16.5);
        text(title, 105, 9.6, { align: 'center' });
        doc.rect(X0, top, W, SHEET_BOTTOM - top);
        font('r', 6.75);
        text('This is a Computer Generated Invoice', 105, SHEET_BOTTOM + 3.8, { align: 'center' });
      }

      function drawTopSection() {
        const leftW = LEFT_W;
        const splitX = X0 + leftW;
        const midY = SHEET_TOP + SUP_H;
        const botY = SHEET_TOP + TOP_H;
        ln(splitX, SHEET_TOP, splitX, botY);
        ln(X0, midY, splitX, midY);
        ln(X0, botY, X1, botY);

        // supplier block with logo (logo centred vertically like the print layout)
        const textX = SUP_TEXT_X;
        const logoBox = 22;
        const logoTop = SHEET_TOP + (SUP_H - logoBox) / 2;
        if (H.logoDataUrl) {
          try {
            let w = logoBox, h = logoBox;
            if (H.logoW && H.logoH) {
              const r = H.logoW / H.logoH;
              if (r > 1) h = logoBox / r; else w = logoBox * r;
            }
            doc.addImage(H.logoDataUrl, 'PNG', X0 + 3 + (logoBox - w) / 2, logoTop + (logoBox - h) / 2, w, h, undefined, 'FAST');
          } catch (e) { /* skip logo */ }
        } else {
          doc.setLineDashPattern([0.8, 0.8], 0);
          doc.rect(X0 + 3, logoTop, logoBox, logoBox);
          doc.setLineDashPattern([], 0);
          font('b', 6.5);
          text('LOGO', X0 + 3 + logoBox / 2, logoTop + logoBox / 2 + 1, { align: 'center' });
        }
        let top = SHEET_TOP + (SUP_H - SUP_CONTENT_H) / 2;
        font('b', SZ.name);
        supNameLines.forEach(l => { text(l, textX, base(top, LH.name, SZ.name)); top += LH.name; });
        if (supContactLines.length) {
          font('s', SZ.sup);
          supContactLines.forEach(l => { text(l, textX, base(top, LH.sup, SZ.sup)); top += LH.sup; });
        }
        font('b', SZ.sup);
        supAddrLines.forEach(l => { text(l, textX, base(top, LH.sup, SZ.sup)); top += LH.sup; });
        text('GSTIN/UIN: ' + (s.gstin || '23CHLPD7073A1ZQ'), textX, base(top, LH.sup, SZ.sup)); top += LH.sup;
        font('r', SZ.sup);
        text('State Name : ' + titleCase(s.state || 'Madhya Pradesh') + ', Code : ' + (codeFor(s.state) || '23'), textX, base(top, LH.sup, SZ.sup));

        // buyer block
        const bx = X0 + 3;
        let by = midY + 1.6;
        font('b', 8.25);
        text('Buyer (Bill to)', bx, base(by, 3.6, 8.25)); by += 4.0;
        font('b', SZ.buyerName);
        wrap(titleCase(inv.partyName || '—'), leftW - 6).slice(0, 2).forEach(l => { text(l, bx, base(by, 5.4, SZ.buyerName)); by += 5.4; });
        font('b', SZ.buyerLine);
        const baddr = titleCase(inv.address || inv.city || '');
        if (baddr) wrap(baddr, leftW - 6).slice(0, 2).forEach(l => { text(l, bx, base(by, 4.6, SZ.buyerLine)); by += 4.6; });
        text('GSTIN/UIN : ' + (inv.gstin || '—'), bx, base(by, 4.6, SZ.buyerLine)); by += 4.6;
        font('r', SZ.buyerState);
        text('State Name : ' + titleCase(inv.state || '—') + ', Code : ' + (inv.stateCode || codeFor(inv.state) || '—'), bx, base(by, 4.0, SZ.buyerState));

        // right meta grid
        const mx0 = splitX, mw = X1 - splitX, cw = mw / 2, rh = TOP_H / 6;
        const cells = [
          ['Invoice No.', inv.number, 'Dated', fmtTallyDate(inv.date)],
          ['Delivery Note', '', 'Mode/Terms of Payment', ''],
          ['Reference No. & Date.', '', 'Other References', ''],
          ["Buyer's Order No.", '', 'Dated', ''],
          ['Dispatch Doc No.', '', 'Delivery Note Date', ''],
          ['Dispatched through', '', 'Destination', titleCase(placeOfSupply)]
        ];
        ln(mx0 + cw, SHEET_TOP, mx0 + cw, botY);
        cells.forEach((c, i) => {
          const ry = SHEET_TOP + i * rh;
          if (i > 0) ln(mx0, ry, X1, ry);
          font('b', 7.5);
          text(c[0], mx0 + 1.2, base(ry + 0.7, 3.2, 7.5));
          text(c[2], mx0 + cw + 1.2, base(ry + 0.7, 3.2, 7.5));
          font('b', 7.9);
          if (c[1]) text(c[1], mx0 + 1.2, base(ry + 3.9, 3.3, 7.9));
          if (c[3]) text(c[3], mx0 + cw + 1.2, base(ry + 3.9, 3.3, 7.9));
        });
      }

      function drawItemsHeader(y) {
        ln(X0, y, X1, y);
        ln(X0, y + HEAD_H, X1, y + HEAD_H);
        font('b', 7.9);
        const cy = base(y, HEAD_H, 7.9);
        text('Sl', colX[0] + colW[0] / 2, base(y + 0.8, 3.35, 7.9), { align: 'center' });
        text('No.', colX[0] + colW[0] / 2, base(y + 0.8 + 3.35, 3.35, 7.9), { align: 'center' });
        text('Description of Goods', colX[1] + colW[1] / 2, cy, { align: 'center' });
        text('HSN/SAC', colX[2] + colW[2] / 2, cy, { align: 'center' });
        text('Quantity', colX[3] + colW[3] / 2, cy, { align: 'center' });
        text('Rate', colX[4] + colW[4] / 2, cy, { align: 'center' });
        text('GST %', colX[5] + colW[5] / 2, cy, { align: 'center' });
        text('GST', colX[6] + colW[6] / 2, cy, { align: 'center' });
        text('Amount', colX[7] + colW[7] / 2, cy, { align: 'center' });
        return y + HEAD_H;
      }

      function drawColumnLines(yTop, yBottom) {
        for (let i = 1; i < colX.length - 1; i++) ln(colX[i], yTop - HEAD_H, colX[i], yBottom);
      }

      function drawRow(r, y) {
        if (r.kind === 'item') {
          const it = r.it;
          const ty = base(y, ITEM_H, 9);
          font('r', 7.9);
          text(String(r.idx + 1), colX[0] + colW[0] / 2, ty, { align: 'center' });
          font('b', 9);
          r.lines.forEach((l, k) => text(l, colX[1] + 1.5, ty + k * 3.7));
          font('r', 7.9);
          text(it.hsn || '—', colX[2] + colW[2] / 2, ty, { align: 'center' });
          font('s', 9);
          const unit = titleCase(it.unit || 'pcs');
          text(num(it.qty).toFixed(2) + ' ' + unit, colX[4] - 1.5, ty, { align: 'right' });
          text(moneyRaw(it.rate), colX[5] - 1.5, ty, { align: 'right' });
          text(num(it.gstRate) + '%', colX[5] + colW[5] / 2, ty, { align: 'center' });
          text(moneyRaw(it.gst), colX[7] - 1.5, ty, { align: 'right' });
          text(moneyRaw(it.taxable), colX[8] - 1.5, ty, { align: 'right' });
        } else {
          const ty = base(y, TAX_ROW_H, 9);
          font('i', 9);
          text(r.label, colX[2] - 3, ty, { align: 'right' });
          font('r', 9);
          if (r.rate) text(r.rate, colX[5] + colW[5] / 2, ty, { align: 'center' });
          text(r.amt, colX[8] - 1.5, ty, { align: 'right' });
        }
      }

      function drawTotalRow(y) {
        ln(X0, y, X1, y);
        ln(X0, y + TOTAL_H, X1, y + TOTAL_H);
        const totalQty = items.reduce((sum, it) => sum + num(it.qty), 0);
        font('s', 9);
        const ty = base(y, TOTAL_H, 9);
        text('Total', colX[2] - 3, ty, { align: 'right' });
        text(totalQty.toFixed(2) + ' ' + (items[0] ? (items[0].unit || 'pcs') : 'pcs'), colX[4] - 1.5, ty, { align: 'right' });
        text(moneyRaw(inv.totalGst), colX[7] - 1.5, ty, { align: 'right' });
        font('b', 10.5);
        text(RS + moneyRaw(inv.grandTotal), colX[8] - 1.5, base(y, TOTAL_H, 10.5), { align: 'right' });
      }

      function drawTail(y) {
        // amount in words
        font('b', 7.5);
        text('Amount Chargeable (in words)', X0 + 1.2, base(y + 0.4, 3.2, 7.5));
        font('b', 7.9);
        text(numberWordsINR(inv.grandTotal), X0 + 1.2, base(y + 3.6, 3.3, 7.9));
        font('i', 7.9);
        text('E. & O.E', X1 - 1.5, base(y + 0.4, 3.2, 7.9), { align: 'right' });
        y += WORDS_H;
        ln(X0, y, X1, y);

        // HSN / tax table
        const ty0 = y;
        let widths;
        if (!isIntra) widths = [56, 46, 22, 36, 36]; else widths = [40, 32, 14, 30, 14, 30, 36];
        const tx = [X0];
        widths.forEach((w, i) => tx.push(tx[i] + w));
        const half = HSN_HEAD_H / 2;
        const hb = (row) => base(ty0 + row, half, 7.5);
        font('b', 7.5);
        if (!isIntra) {
          text('HSN/SAC', (tx[0] + tx[1]) / 2, base(ty0, HSN_HEAD_H, 7.5), { align: 'center' });
          text('Taxable', (tx[1] + tx[2]) / 2, base(ty0 + 0.3, 3.2, 7.5), { align: 'center' });
          text('Value', (tx[1] + tx[2]) / 2, base(ty0 + 3.5, 3.2, 7.5), { align: 'center' });
          text('IGST', (tx[2] + tx[4]) / 2, hb(0), { align: 'center' });
          text('Rate', (tx[2] + tx[3]) / 2, hb(half), { align: 'center' });
          text('Amount', (tx[3] + tx[4]) / 2, hb(half), { align: 'center' });
          text('Total', (tx[4] + tx[5]) / 2, base(ty0 + 0.3, 3.2, 7.5), { align: 'center' });
          text('Tax Amount', (tx[4] + tx[5]) / 2, base(ty0 + 3.5, 3.2, 7.5), { align: 'center' });
          ln(tx[2], ty0 + half, tx[4], ty0 + half);
        } else {
          text('HSN/SAC', (tx[0] + tx[1]) / 2, base(ty0, HSN_HEAD_H, 7.5), { align: 'center' });
          text('Taxable', (tx[1] + tx[2]) / 2, base(ty0 + 0.3, 3.2, 7.5), { align: 'center' });
          text('Value', (tx[1] + tx[2]) / 2, base(ty0 + 3.5, 3.2, 7.5), { align: 'center' });
          text('Central Tax', (tx[2] + tx[4]) / 2, hb(0), { align: 'center' });
          text('State Tax', (tx[4] + tx[6]) / 2, hb(0), { align: 'center' });
          text('Rate', (tx[2] + tx[3]) / 2, hb(half), { align: 'center' });
          text('Amount', (tx[3] + tx[4]) / 2, hb(half), { align: 'center' });
          text('Rate', (tx[4] + tx[5]) / 2, hb(half), { align: 'center' });
          text('Amount', (tx[5] + tx[6]) / 2, hb(half), { align: 'center' });
          text('Total', (tx[6] + tx[7]) / 2, base(ty0 + 0.3, 3.2, 7.5), { align: 'center' });
          text('Tax Amount', (tx[6] + tx[7]) / 2, base(ty0 + 3.5, 3.2, 7.5), { align: 'center' });
          ln(tx[2], ty0 + half, tx[4], ty0 + half);
          ln(tx[4], ty0 + half, tx[6], ty0 + half);
        }
        ln(X0, ty0 + HSN_HEAD_H, X1, ty0 + HSN_HEAD_H);

        let ry = ty0 + HSN_HEAD_H;
        font('s', 9);
        hsnList.forEach(h => {
          const b = base(ry, HSN_ROW_H, 9);
          text(h.hsn, tx[0] + 1.2, b);
          text(moneyRaw(h.taxable), tx[2] - 1.2, b, { align: 'right' });
          if (!isIntra) {
            text(num(h.gstRate) + '%', (tx[2] + tx[3]) / 2, b, { align: 'center' });
            text(moneyRaw(h.igst || h.totalTax), tx[4] - 1.2, b, { align: 'right' });
            text(moneyRaw(h.totalTax), tx[5] - 1.2, b, { align: 'right' });
          } else {
            text((num(h.gstRate) / 2) + '%', (tx[2] + tx[3]) / 2, b, { align: 'center' });
            text(moneyRaw(h.cgst), tx[4] - 1.2, b, { align: 'right' });
            text((num(h.gstRate) / 2) + '%', (tx[4] + tx[5]) / 2, b, { align: 'center' });
            text(moneyRaw(h.sgst), tx[6] - 1.2, b, { align: 'right' });
            text(moneyRaw(h.totalTax), tx[7] - 1.2, b, { align: 'right' });
          }
          ry += HSN_ROW_H;
          ln(X0, ry, X1, ry);
        });
        // total row
        const b = base(ry, HSN_ROW_H, 9);
        text('Total', tx[1] - 1.2, b, { align: 'right' });
        text(moneyRaw(inv.taxable), tx[2] - 1.2, b, { align: 'right' });
        if (!isIntra) {
          text(moneyRaw(inv.totalGst), tx[4] - 1.2, b, { align: 'right' });
          text(moneyRaw(inv.totalGst), tx[5] - 1.2, b, { align: 'right' });
        } else {
          text(moneyRaw(inv.cgst), tx[4] - 1.2, b, { align: 'right' });
          text(moneyRaw(inv.sgst), tx[6] - 1.2, b, { align: 'right' });
          text(moneyRaw(inv.totalGst), tx[7] - 1.2, b, { align: 'right' });
        }
        ry += HSN_ROW_H;
        ln(X0, ry, X1, ry);
        // vertical lines of the tax table
        for (let i = 1; i < tx.length - 1; i++) {
          if (!isIntra && i === 3) ln(tx[i], ty0 + half, tx[i], ry);
          else if (isIntra && (i === 3 || i === 5)) ln(tx[i], ty0 + half, tx[i], ry);
          else ln(tx[i], ty0, tx[i], ry);
        }

        // tax amount in words
        font('r', 7.9);
        const twb = base(ry, TAXWORDS_H, 7.9);
        text('Tax Amount (in words) : ', X0 + 1.2, twb);
        const lblW = doc.getTextWidth('Tax Amount (in words) : ');
        font('b', 7.9);
        text(numberWordsINR(inv.totalGst), X0 + 1.2 + lblW, twb);
        ry += TAXWORDS_H;
        ln(X0, ry, X1, ry);

        // bottom: bank + declaration | QR | signatory
        const hasQr = !!H.qrDataUrl;
        const leftW = hasQr ? 82 : 100;
        const midW = hasQr ? 44 : 0;
        const splitX = X0 + leftW;
        ln(splitX, ry, splitX, SHEET_BOTTOM);
        if (hasQr) ln(splitX + midW, ry, splitX + midW, SHEET_BOTTOM);
        const bankH = 25.5;
        ln(X0, ry + bankH, splitX, ry + bankH);
        font('s', 9);
        text("COMPANY'S BANK DETAILS", X0 + 1.2, base(ry + 0.5, 3.8, 9));
        const bankRows = [
          ['Bank Name', s.bankName || ''],
          ['A/c No.', s.accountNumber || ''],
          ['Branch', s.branch || ''],
          ['Ifsc Code', s.ifsc || '']
        ];
        const valMaxW = splitX - 2 - (X0 + 24);
        bankRows.forEach((r, i) => {
          const by = base(ry + 4.6 + i * 4.8, 4.8, 9);
          font('s', 9);
          text(r[0].toUpperCase(), X0 + 1.2, by);
          const val = ': ' + String(r[1]).toUpperCase();
          let fs = 9;
          font('b', fs);
          while (fs > 6 && doc.getTextWidth(val) > valMaxW) { fs -= 0.5; font('b', fs); }
          text(val, X0 + 24, by);
        });
        if (hasQr) {
          try {
            const QR_SIZE = Math.min(midW - 3, BOTTOM_H - 6.5);
            let qw = QR_SIZE, qh = QR_SIZE;
            if (H.qrW && H.qrH) {
              const r = H.qrW / H.qrH;
              if (r > 1) qh = QR_SIZE / r; else qw = QR_SIZE * r;
            }
            const cx = splitX + midW / 2;
            const top = ry + 1.2;
            doc.addImage(H.qrDataUrl, 'PNG', cx - qw / 2, top + (QR_SIZE - qh) / 2, qw, qh, undefined, 'FAST');
            font('b', 6.75);
            text('Scan to Pay', cx, top + QR_SIZE + 3.3, { align: 'center' });
          } catch (e) { /* skip QR */ }
        }

        let dy = ry + bankH + 0.6;
        font('b', 8.25);
        text('Declaration', X0 + 1.2, base(dy, 3.5, 8.25)); dy += 3.5;
        font('r', 7.1);
        wrap('We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.', leftW - 3).forEach(l => { text(l, X0 + 1.2, base(dy, 3.0, 7.1)); dy += 3.0; });
        const terms = String(inv.notes || s.terms || '1. Goods once sold will not be taken back.\n2. Please inspect goods at the time of delivery.\n3. Subject to local jurisdiction only.')
          .split('\n').map(t => t.trim()).filter(Boolean);
        terms.forEach(t => wrap(t, leftW - 3).forEach(l => { if (dy < SHEET_BOTTOM - 1.5) { text(l, X0 + 1.2, base(dy, 3.0, 7.1)); dy += 3.0; } }));

        const biz = String(s.businessName || 'ROYAL SANITATION');
        font('b', 7.5);
        const bw = doc.getTextWidth(biz);
        font('r', 7.5);
        const fw = doc.getTextWidth('for ');
        text('for ', X1 - 2 - bw - fw, base(ry + 0.5, 3.4, 7.5));
        font('b', 7.5);
        text(biz, X1 - 2, base(ry + 0.5, 3.4, 7.5), { align: 'right' });
        font('r', 7.5);
        text(s.signatory || 'Authorised Signatory', X1 - 2, SHEET_BOTTOM - 2.3, { align: 'right' });
      }

      // ---- paginate ----
      const availFinalFull = SHEET_BOTTOM - TAIL_H - TOTAL_H;
      let remaining = rows.slice();
      let page = 0;
      while (true) {
        if (page > 0) doc.addPage();
        drawFrame(SHEET_TOP, page === 0 ? 'Tax Invoice' : 'Tax Invoice (continued)');
        let yStart;
        if (page === 0) {
          drawTopSection();
          yStart = drawItemsHeader(SHEET_TOP + TOP_H);
        } else {
          yStart = drawItemsHeader(SHEET_TOP);
        }
        const sum = remaining.reduce((a, r) => a + r.h, 0);
        if (sum <= availFinalFull - yStart) {
          // final page
          let y = yStart;
          remaining.forEach(r => { drawRow(r, y); y += r.h; });
          drawColumnLines(yStart, availFinalFull);
          drawTotalRow(availFinalFull);
          drawTail(SHEET_BOTTOM - TAIL_H);
          break;
        }
        // intermediate page: take as many rows as fit, but leave at least one for the next page
        const availBottom = SHEET_BOTTOM - 5;
        let y = yStart, taken = 0;
        while (taken < remaining.length && y + remaining[taken].h <= availBottom) { y += remaining[taken].h; taken++; }
        // never leave the tax/round-off rows alone on the next page: they travel with at least one item
        let trailingTax = 0;
        for (let k = remaining.length - 1; k >= 0 && remaining[k].kind === 'tax'; k--) trailingTax++;
        const maxTaken = Math.max(1, remaining.length - (trailingTax + 1));
        if (taken > maxTaken) taken = maxTaken;
        if (taken < 1) taken = 1;
        y = yStart;
        remaining.slice(0, taken).forEach(r => { drawRow(r, y); y += r.h; });
        drawColumnLines(yStart, SHEET_BOTTOM);
        font('r', 7);
        text('continued ...', X1 - 2, SHEET_BOTTOM - 1.5, { align: 'right' });
        remaining = remaining.slice(taken);
        page++;
        if (page > 40) break;
      }

      return doc.output('blob');
    }

    /** Build the invoice as a real text PDF (selectable and copyable text). */
    async function createInvoicePdfBlob(inv) {
      const pdfAvailable = await loadHtml2Pdf();
      if (!pdfAvailable) throw new Error('PDF generator unavailable. Check your internet connection and try again.');

      const fileName = getInvoiceFileName(inv);
      const s = invoiceSupplier(inv);
      const [fonts, logo, qr] = await Promise.all([
        loadPdfFonts(),
        prepareLogoForPdf((s && s.logo) || ''),
        prepareLogoForPdf((s && s.qr) || '', true)
      ]);
      const blob = await buildInvoiceTextPdf(inv, s, {
        jsPDF: window.jspdf.jsPDF,
        num, round2, moneyRaw, titleCase, fmtTallyDate, codeFor, numberWordsINR,
        supplierAddressLines, supplierContactLine,
        qrDataUrl: qr.logoDataUrl, qrW: qr.logoW, qrH: qr.logoH,
        ...fonts, ...logo
      });
      if (!(blob instanceof Blob) || blob.size === 0) throw new Error('The generated PDF was empty.');
      return { blob, fileName };
    }

    function downloadBlob(filename, blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /** Generate and download a PDF directly without opening the browser print dialog. */
    async function downloadInvoice(inv) {
      if (!inv) return;
      try {
        notify('Generating invoice PDF…');
        const { blob, fileName } = await createInvoicePdfBlob(inv);
        downloadBlob(`${fileName}.pdf`, blob);
        notify(`PDF downloaded: ${fileName}.pdf`);
      } catch (err) {
        console.error('Invoice PDF download failed:', err);
        notify(err && err.message ? `PDF download failed: ${err.message}` : 'PDF download failed. Please try again.');
      }
    }

    /** Generate the invoice PDF and send it directly through the secured WhatsApp backend. */
    async function shareWhatsApp(inv) {
      const s = inv.supplierSnapshot || db.settings;
      let phone = String(inv.phone || '').replace(/\D/g, '');
      if (phone.length === 10) phone = '91' + phone;
      if (phone.length < 10 || phone.length > 15) {
        notify('Add a valid customer WhatsApp number with country code to this invoice first.');
        return;
      }
      if (!WHATSAPP_SEND_ENDPOINT.startsWith('https://') || WHATSAPP_SEND_ENDPOINT.includes('YOUR-CLOUD-RUN-SERVICE-URL')) {
        notify('WhatsApp sending is not configured yet. Deploy the backend and set WHATSAPP_SEND_ENDPOINT in this HTML file.');
        return;
      }
      if (!_auth || !_auth.currentUser) {
        notify('Sign in before sending an invoice on WhatsApp.');
        return;
      }

      const msg = `Dear ${inv.partyName || 'Customer'},\n\n` +
        `Please find attached your Tax Invoice from ${s.businessName || 'Royal Sanitation'}.\n` +
        `Invoice No: ${inv.number}\n` +
        `Date: ${fmtDate(inv.date)}\n` +
        `Grand Total: ${money(inv.grandTotal)}\n\n` +
        `Thank you for your business!`;

      try {
        notify('Generating invoice PDF and sending it to WhatsApp…');
        const { blob, fileName } = await createInvoicePdfBlob(inv);
        const file = new File([blob], `${fileName}.pdf`, { type: 'application/pdf' });
        const idToken = await _auth.currentUser.getIdToken();
        const form = new FormData();
        form.append('pdf', file, `${fileName}.pdf`);
        form.append('to', phone);
        form.append('caption', msg);
        form.append('invoiceNumber', String(inv.number || ''));
        form.append('customerName', String(inv.partyName || 'Customer'));
        form.append('amount', String(money(inv.grandTotal)));

        const response = await fetch(WHATSAPP_SEND_ENDPOINT, {
          method: 'POST',
          headers: { Authorization: `Bearer ${idToken}` },
          body: form
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          const message = result && result.error ? result.error : `WhatsApp service returned HTTP ${response.status}.`;
          throw new Error(message);
        }
        notify(`Invoice ${inv.number} accepted by WhatsApp for ${inv.partyName || phone}.`);
        console.info('WhatsApp send accepted:', { invoiceNumber: inv.number, messageId: result.messageId || null });
      } catch (err) {
        console.error('Automatic WhatsApp invoice send failed:', err);
        notify(err.message || 'Could not send the invoice to WhatsApp.');
      }
    }

    /** Export all invoices as CSV */
    function exportCSV() {
      const headers = [
        'Invoice Number', 'Date', 'Status', 'Party Name', 'GSTIN',
        'Billing Address', 'State', 'Place of Supply', 'Taxable Value',
        'CGST', 'SGST', 'IGST', 'Total GST', 'Discount',
        'Cartage & Forwarding', 'Round Off', 'Grand Total'
      ];

      const rows = db.invoices.map(i => [
        i.number, i.date, i.status, i.partyName, i.gstin,
        i.address, i.state, i.placeOfSupply, i.taxable,
        i.cgst, i.sgst, i.igst, i.totalGst, i.discount,
        i.otherCharges, i.roundOff, i.grandTotal
      ]);

      const csvSafe = cell => {
        let value = String(cell ?? '');
        // Prevent spreadsheet applications from interpreting untrusted text as formulas.
        if (/^[=+@]/.test(value) || /^-[^0-9.]/.test(value)) value = "'" + value;
        return '"' + value.replace(/"/g, '""') + '"';
      };
      const csvContent = [headers, ...rows]
        .map(row => row.map(csvSafe).join(','))
        .join('\r\n');

      downloadFile('royal-sanitation-invoices.csv', '\ufeff' + csvContent, 'text/csv;charset=utf-8');
      notify('Invoice register exported as CSV.');
    }

    /* ==========================================================================
       SECTION 7: ACTIONS & EVENT HANDLERS
       ========================================================================== */
    /** Dispatch user actions cleanly */
    function handleAction(action, targetId, targetIndex) {
      const inv = db.invoices.find(i => i.id === targetId);

      switch (action) {
        case 'new-invoice':
          editingId = null;
          invoiceDraft = null;
          setPage('create');
          break;

        case 'edit':
          if (inv) {
            editingId = targetId;
            setPage('create');
          }
          break;

        case 'view':
          if (inv) printInvoice(inv, true); // Preview mode without immediate print prompt
          break;

        case 'download':
          if (inv) downloadInvoice(inv);
          break;

        case 'print':
          if (inv) printInvoice(inv, false); // Print mode with immediate window.print()
          break;

        case 'whatsapp':
          if (inv) shareWhatsApp(inv);
          break;

        case 'delete':
          deleteInvoice(targetId);
          break;

        case 'reset-invoice':
          confirmBox('Reset Invoice Form', 'Discard all unsaved entries on this invoice?', 'Reset').then(ok => {
            if (ok) {
              editingId = null;
              setPage('create');
            }
          });
          break;

        case 'remove-item':
          if (invoiceDraft && invoiceDraft.items) {
            invoiceDraft.items.splice(Number(targetIndex), 1);
            if (!invoiceDraft.items.length) {
              invoiceDraft.items.push(blankItem());
            }
            renderItems();
            document.getElementById('invoice-form').dataset.dirty = '1';
          }
          break;

        case 'export-backup':
          downloadFile(
            'royal-sanitation-backup-' + new Date().toISOString().slice(0, 10) + '.json',
            JSON.stringify(db, null, 2),
            'application/json'
          );
          notify('Full backup exported.');
          break;

        case 'export-csv':
          exportCSV();
          break;

        case 'clear-all':
          clearAllData();
          break;

        case 'new-party':
          partyEditor();
          break;

        case 'edit-party':
          partyEditor(db.parties.find(p => p.id === targetId));
          break;

        case 'delete-party':
          deleteParty(targetId);
          break;

        case 'new-product':
          productEditor();
          break;

        case 'edit-product':
          productEditor(db.products.find(p => p.id === targetId));
          break;

        case 'delete-product':
          deleteProduct(targetId);
          break;

        case 'remove-logo':
          db.settings.logo = '';
          saveDB();
          render();
          notify('Logo removed.');
          break;

        case 'remove-qr':
          db.settings.qr = '';
          saveDB();
          render();
          notify('QR code removed.');
          break;
      }
    }

    /** Delete or Cancel an Invoice with Audit Safety */
    async function deleteInvoice(id) {
      const inv = db.invoices.find(i => i.id === id);
      if (!inv) return;

      if (inv.status === 'Cancelled') {
        const confirmed = await confirmBox(
          'Permanently Delete Invoice?',
          `Invoice ${inv.number} is already cancelled. Deleting it removes it permanently from the database on all devices. This cannot be undone.`,
          'Delete Permanently'
        );
        if (!confirmed) return;

        db.invoices = db.invoices.filter(i => i.id !== id);
        markDeleted('invoices', id);
      } else if (inv.status === 'Issued') {
        const confirmed = await confirmBox(
          'Cancel Issued Invoice?',
          `Invoice ${inv.number} has been legally issued. It will be marked as "Cancelled" to preserve accounting records rather than erased.`,
          'Mark as Cancelled'
        );
        if (!confirmed) return;

        inv.status = 'Cancelled';
        inv.updatedAt = new Date().toISOString();
      } else {
        const confirmed = await confirmBox(
          'Delete Draft Invoice?',
          `Permanently delete draft ${inv.number}? This action cannot be undone.`,
          'Delete Draft'
        );
        if (!confirmed) return;

        db.invoices = db.invoices.filter(i => i.id !== id);
        markDeleted('invoices', id);
      }

      saveDB();
      notify('Invoice updated.');
      render();
    }

    /** Delete customer with dependency check */
    async function deleteParty(id) {
      const p = db.parties.find(x => x.id === id);
      if (!p) return;

      const linked = db.invoices.some(i => i.partyId === id || String(i.partyName || '').toLowerCase() === String(p.name || '').toLowerCase());
      const ok = await confirmBox('Delete Customer?', `Remove "${p.name}" from your saved customers everywhere (all devices)?` + (linked ? ' Existing invoices keep their own copy of the customer details.' : ''), 'Delete');
      if (!ok) return;

      db.parties = db.parties.filter(x => x.id !== id);
      markDeleted('parties', id);
      saveDB();
      render();
      notify('Customer deleted.');
    }

    /** Delete product item from catalogue */
    async function deleteProduct(id) {
      const p = db.products.find(x => x.id === id);
      if (!p) return;

      const ok = await confirmBox('Delete Catalogue Item?', `Remove "${p.name}" from your product catalogue?`, 'Delete');
      if (!ok) return;

      db.products = db.products.filter(x => x.id !== id);
      markDeleted('products', id);
      saveDB();
      render();
      notify('Item deleted from catalogue.');
    }

    /** Reset all local and cloud data */
    async function clearAllData() {
      const ok = await confirmBox(
        'Clear All Data?',
        'This will permanently remove all invoices, customers, products, and settings from this device AND the cloud. Please export a backup first.',
        'Erase Everything'
      );
      if (!ok) return;

      const oldDb = db;
      localStorage.removeItem(STORAGE_KEY);
      db = structuredClone(DEFAULTS);
      // Tombstone everything so other devices don't restore it on their next sync
      ['invoices', 'parties', 'products'].forEach(k => (oldDb[k] || []).forEach(r => markDeleted(k, r && r.id)));
      saveDB();
      notify('All data cleared (local + cloud).');
      setPage('dashboard');
    }

    /** Filter invoice register */
    function filterInvoices() {
      const query = (document.getElementById('invoice-search')?.value || '').toLowerCase();
      const status = document.getElementById('status-filter')?.value || '';
      const fromDate = document.getElementById('from-date')?.value || '';
      const toDate = document.getElementById('to-date')?.value || '';

      const filtered = db.invoices.filter(inv => {
        const textMatch = [inv.number, inv.partyName, inv.gstin, inv.address].join(' ').toLowerCase().includes(query);
        const statusMatch = !status || inv.status === status;
        const fromMatch = !fromDate || inv.date >= fromDate;
        const toMatch = !toDate || inv.date <= toDate;
        return textMatch && statusMatch && fromMatch && toMatch;
      }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const container = document.getElementById('invoice-table-container');
      if (container) container.innerHTML = invoiceTableBody(filtered);
    }

    /** Bind page-specific events after render */
    function bindPageEvents() {
      // Create Invoice Form bindings
      if (currentPage === 'create') {
        const form = document.getElementById('invoice-form');
        if (!form) return;

        form.addEventListener('input', e => {
          if (e.target.id !== 'inv-number') form.dataset.dirty = '1';
          if (['discount', 'discount-mode', 'other-charges', 'round-off', 'place-state'].includes(e.target.id)) {
            refreshCalc();
          }
          if (e.target.id === 'party-gstin') gstinWarning();
        });

        form.addEventListener('change', e => {
          if (e.target.id === 'party-state') {
            document.getElementById('party-code').value = codeFor(e.target.value);
            document.getElementById('place-state').value = e.target.value;
            gstinWarning();
            refreshCalc();
          }
          if (e.target.id === 'place-state') {
            document.getElementById('party-state').value = e.target.value;
            document.getElementById('party-code').value = codeFor(e.target.value);
            gstinWarning();
            refreshCalc();
          }
          if (e.target.id === 'party-name') loadPartyByName(e.target.value);
        });

        document.getElementById('add-item').onclick = () => {
          invoiceDraft.items.push(blankItem());
          renderItems();
          form.dataset.dirty = '1';
        };

        // Auto Round-Off Button
        const autoRoundBtn = document.getElementById('auto-round-btn');
        if (autoRoundBtn) {
          autoRoundBtn.onclick = () => {
            const discount = Math.max(0, num(document.getElementById('discount')?.value));
            const discountMode = document.getElementById('discount-mode')?.value || 'before';
            const gross = invoiceDraft.items.reduce((sum, it) => sum + (num(it.qty) * num(it.rate)), 0);
            const factor = (discountMode === 'before' && gross > 0) ? Math.max(0, (gross - Math.min(discount, gross)) / gross) : 1;

            let taxable = 0;
            let totalGst = 0;
            invoiceDraft.items.forEach(it => {
              const itemCalc = calcItem({ ...it, gstRate: 18 }, factor);
              taxable += itemCalc.taxable;
              totalGst += itemCalc.gst;
            });

            const other = Math.max(0, num(document.getElementById('other-charges')?.value));
            const afterDiscount = (discountMode === 'after') ? discount : 0;
            const subtotal = round2(taxable + totalGst + other - afterDiscount);
            const targetRounded = Math.round(subtotal);
            const diff = round2(targetRounded - subtotal);

            const roundInput = document.getElementById('round-off');
            if (roundInput) {
              roundInput.value = diff;
              form.dataset.dirty = '1';
              refreshCalc();
            }
          };
        }

        document.getElementById('preview-invoice').onclick = () => {
          const invData = getFormInvoice();
          if (!invData.partyName || !invData.date || !invData.number) {
            notify('Please fill Invoice Number, Date, and Customer Name first.');
            return;
          }
          printInvoice(invData, true);
        };

        form.addEventListener('submit', async e => {
          e.preventDefault();
          const invData = getFormInvoice();

          if (!invData.partyName || !invData.date || !invData.number || !invData.state || !invData.placeOfSupply) {
            notify('Please fill all required invoice and customer fields.');
            return;
          }

          if (!invData.items.length || invData.items.some(i => !i.description.trim() || num(i.qty) <= 0 || num(i.rate) < 0)) {
            notify('Each item must have a description, positive quantity, and valid rate.');
            return;
          }

          // Check for duplicate invoice number
          if (db.invoices.some(i => i.number.toLowerCase() === invData.number.toLowerCase() && i.id !== editingId)) {
            notify('An invoice with this number already exists. Please use a unique number.');
            return;
          }

          if (invData.gstin && invData.gstin.length !== 15) {
            const proceed = await confirmBox('GSTIN Warning', 'Customer GSTIN is not 15 characters long. Save anyway?', 'Save Anyway');
            if (!proceed) return;
          }

          const existing = editingId ? db.invoices.find(i => i.id === editingId) : null;
          const now = new Date().toISOString();

          invData.id = editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
          invData.createdAt = existing?.createdAt || now;
          invData.updatedAt = now;

          if (existing) {
            db.invoices = db.invoices.map(i => i.id === existing.id ? invData : i);
            // If the number was changed to a higher one, keep the next auto-number ahead of it (never lowers it)
            if (existing.number !== invData.number) {
              const editedSeq = parseInt(String(invData.number).split('/').at(-1), 10);
              if (!isNaN(editedSeq) && editedSeq + 1 > db.seq) {
                db.seq = editedSeq + 1;
                db.settings.nextNumber = db.seq;
              }
            }
          } else {
            db.invoices.unshift(invData);
            // Increment invoice sequence counter
            const extractedSeq = parseInt(invData.number.split('/').at(-1), 10);
            if (!isNaN(extractedSeq)) {
              db.seq = Math.max(db.seq, extractedSeq + 1);
            } else {
              db.seq++;
            }
            db.settings.nextNumber = db.seq;
          }

          // Auto-save or update customer party in directory
          if (invData.partyName) {
            const customerObj = {
              id: invData.partyId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
              name: invData.partyName,
              gstin: invData.gstin,
              address: invData.address,
              state: invData.state,
              stateCode: invData.stateCode,
              phone: invData.phone,
              email: invData.email || '',
              updatedAt: now
            };

            const existingIndex = db.parties.findIndex(p => p.name.toLowerCase() === customerObj.name.toLowerCase());
            if (existingIndex >= 0) {
              customerObj.id = db.parties[existingIndex].id;
              db.parties[existingIndex] = customerObj;
            } else {
              db.parties.push(customerObj);
            }
          }

          // Auto-save or update products in the catalogue from invoice line items
          invData.items.forEach(it => {
            if (!it.description || !it.description.trim()) return;
            const itemName = it.description.trim();
            const existingProdIdx = db.products.findIndex(p => p.name.toLowerCase() === itemName.toLowerCase());
            if (existingProdIdx >= 0) {
              // Update existing product with latest details
              db.products[existingProdIdx] = {
                ...db.products[existingProdIdx],
                hsn: it.hsn || db.products[existingProdIdx].hsn || '',
                unit: it.unit || db.products[existingProdIdx].unit || 'pcs',
                rate: num(it.rate) || db.products[existingProdIdx].rate || 0,
                gstRate: num(it.gstRate) !== undefined ? num(it.gstRate) : db.products[existingProdIdx].gstRate,
                updatedAt: now
              };
            } else {
              // Save as new product
              db.products.push({
                id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
                name: itemName,
                hsn: it.hsn || '',
                unit: it.unit || 'pcs',
                rate: num(it.rate) || 0,
                gstRate: num(it.gstRate) ?? 18,
                description: '',
                updatedAt: now
              });
            }
          });

          if (!saveDB()) return;

          notify(existing ? 'Invoice updated successfully.' : 'Invoice created successfully.');
          editingId = null;
          setPage('invoices');
        });

        renderItems();
        gstinWarning();
      }

      // Invoices Register Filters
      if (currentPage === 'invoices') {
        ['invoice-search', 'status-filter', 'from-date', 'to-date'].forEach(id => {
          document.getElementById(id)?.addEventListener('input', filterInvoices);
        });
      }

      // Business Settings Form
      if (currentPage === 'settings') {
        const form = document.getElementById('settings-form');
        document.getElementById('settings-state')?.addEventListener('change', e => {
          document.getElementById('settings-code').value = codeFor(e.target.value);
        });

        form?.addEventListener('submit', e => {
          e.preventDefault();
          const fd = new FormData(form);
          for (const [key, val] of fd.entries()) {
            if (key === 'financialYear') {
              db.settings[key] = (val === 'true');
            } else if (key === 'nextNumber') {
              db.settings[key] = Math.max(1, parseInt(val, 10) || 1);
            } else {
              db.settings[key] = String(val).trim();
            }
          }
          db.seq = db.settings.nextNumber;
          saveDB();
          notify('Business settings saved.');
          render();
        });

        // Logo Upload
        document.getElementById('logo-file')?.addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 500000) {
            notify('Logo image must be under 500 KB.');
            e.target.value = '';
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            db.settings.logo = reader.result;
            saveDB();
            render();
            notify('Logo uploaded.');
          };
          reader.readAsDataURL(file);
        });

        // QR Code Upload
        document.getElementById('qr-file')?.addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;
          if (file.size > 500000) {
            notify('QR code image must be under 500 KB.');
            e.target.value = '';
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            db.settings.qr = reader.result;
            saveDB();
            render();
            notify('QR code uploaded.');
          };
          reader.readAsDataURL(file);
        });

        // Backup Import
        document.getElementById('import-backup')?.addEventListener('change', async e => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const imported = JSON.parse(await file.text());
            if (!imported.settings || !Array.isArray(imported.invoices)) {
              throw new Error('Invalid format');
            }
            const ok = await confirmBox('Import Backup', 'This will overwrite your existing local data with the backup file.', 'Replace Data');
            if (!ok) return;

            db = { ...structuredClone(DEFAULTS), ...imported, deleted: normalizeDeleted(imported.deleted) };
            saveDB();
            notify('Backup imported successfully.');
            render();
          } catch (err) {
            notify('Could not import backup. Invalid JSON file format.');
          }
          e.target.value = '';
        });
      }

      // Customer Directory Search
      if (currentPage === 'parties') {
        document.getElementById('party-search')?.addEventListener('input', e => {
          const q = e.target.value.toLowerCase();
          const filtered = db.parties.filter(p => [p.name, p.gstin, p.address, p.state].join(' ').toLowerCase().includes(q));
          document.getElementById('parties-table-container').innerHTML = partyTable(filtered);
        });
      }

      // Product Catalogue Search
      if (currentPage === 'products') {
        document.getElementById('product-search')?.addEventListener('input', e => {
          const q = e.target.value.toLowerCase();
          const filtered = db.products.filter(p => [p.name, p.hsn, p.description].join(' ').toLowerCase().includes(q));
          document.getElementById('products-table-container').innerHTML = productTable(filtered);
        });
      }
    }

    /* ==========================================================================
       SECTION 8: GLOBAL EVENT DELEGATION & INIT
       ========================================================================== */
    // Sidebar Navigation
    document.getElementById('nav').addEventListener('click', e => {
      const btn = e.target.closest('[data-page]');
      if (!btn) return;

      if (currentPage === 'create' && btn.dataset.page !== 'create' && document.getElementById('invoice-form')?.dataset.dirty === '1') {
        confirmBox('Leave Invoice Form?', 'You have unsaved changes. Are you sure you want to leave?', 'Leave').then(ok => {
          if (ok) {
            editingId = null;
            setPage(btn.dataset.page);
          }
        });
        return;
      }

      editingId = null;
      setPage(btn.dataset.page);
    });

    // Delegated Action Click Handler
    document.addEventListener('click', e => {
      // In-page navigation buttons
      const pageBtn = e.target.closest('[data-page]');
      if (pageBtn && !pageBtn.closest('#nav')) {
        if (currentPage === 'create' && pageBtn.dataset.page !== 'create' && document.getElementById('invoice-form')?.dataset.dirty === '1') {
          confirmBox('Leave Invoice Form?', 'You have unsaved changes. Are you sure you want to leave?', 'Leave').then(ok => {
            if (ok) {
              editingId = null;
              setPage(pageBtn.dataset.page);
            }
          });
          return;
        }
        editingId = null;
        setPage(pageBtn.dataset.page);
        return;
      }

      // Action triggers
      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        handleAction(actionBtn.dataset.action, actionBtn.dataset.id, actionBtn.dataset.index);
      }
    });

    // Populate line item from catalogue when user selects a known product
    document.addEventListener('change', e => {
      if (currentPage !== 'create' || !e.target.matches('.items-table [data-k="description"]')) return;
      const selectedName = e.target.value.trim().toLowerCase();
      const product = db.products.find(p => p.name.toLowerCase() === selectedName);
      if (!product) return;

      const tr = e.target.closest('tr');
      const idx = Number(tr.dataset.item);
      const item = invoiceDraft.items[idx];

      item.description = product.name;
      item.hsn = product.hsn || '';
      item.unit = product.unit || 'pcs';
      item.rate = num(product.rate);
      item.gstRate = num(product.gstRate);

      renderItems();
      document.getElementById('invoice-form').dataset.dirty = '1';
    });

    // User-entered names and descriptions are preserved exactly as typed.

    // Initialize application
    document.getElementById('today').textContent = new Date().toLocaleDateString('en-IN', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });

    // Auth gate: never expose the accounting interface or request Firestore data before sign-in.
    const authGate = document.getElementById('auth-gate');
    const authForm = document.getElementById('auth-form');
    const authError = document.getElementById('auth-error');
    const authSubmit = document.getElementById('auth-submit');

    function showAuthError(message) {
      authError.textContent = message || '';
      authSubmit.disabled = false;
      authSubmit.textContent = 'Sign In';
    }

    authForm.addEventListener('submit', async e => {
      e.preventDefault();
      showAuthError('');
      authSubmit.disabled = true;
      authSubmit.textContent = 'Signing in…';
      try {
        await initFirebase();
        await _auth.signInWithEmailAndPassword(
          document.getElementById('auth-email').value.trim(),
          document.getElementById('auth-password').value
        );
      } catch (err) {
        console.error('Sign-in failed:', err);
        showAuthError(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
          ? 'Email or password is incorrect.'
          : 'Sign-in failed. Check Firebase Authentication setup and try again.');
      }
    });

    document.getElementById('auth-reset').addEventListener('click', async () => {
      showAuthError('');
      const email = document.getElementById('auth-email').value.trim();
      if (!email) { showAuthError('Enter your email address first, then choose Reset Password.'); return; }
      try {
        await initFirebase();
        await _auth.sendPasswordResetEmail(email);
        showAuthError('If this account exists, a password reset email has been sent.');
      } catch (err) {
        console.error('Password reset failed:', err);
        showAuthError('Could not send the reset email. Check Firebase Authentication setup.');
      }
    });

    document.getElementById('sign-out').addEventListener('click', async () => {
      try { if (_auth) await _auth.signOut(); }
      catch (err) { console.error('Sign-out failed:', err); notify('Could not sign out. Please try again.'); }
    });

    initFirebase().then(() => {
      _auth.onAuthStateChanged(user => {
        if (user) {
          document.body.classList.add('authenticated');
          authGate.style.display = 'none';
          showAuthError('');
          render();
          syncFromCloud();
        } else {
          stopLiveSync();
          document.body.classList.remove('authenticated');
          authGate.style.display = 'grid';
          _setSyncBadge('connecting');
        }
      });
    }).catch(err => {
      console.error('Firebase initialization failed:', err);
      showAuthError('Cannot connect to Firebase. Check your internet connection and Firebase project configuration.');
    });
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17212b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Royal Sanitation | GST Invoice Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- External SDKs are loaded on demand so the initial screen can render faster. -->

  <style>
    /* ==========================================================================
       1. CSS VARIABLES & DESIGN SYSTEM
       ========================================================================== */
    :root {
      --ink: #17212b;
      --ink-light: #2c3b4d;
      --muted: #627282;
      --muted-light: #8e9ca8;
      --line: #e2e7ec;
      --line-subtle: #edf1f5;
      --bg: #f5f7f9;
      --surface: #ffffff;
      --orange: #e65c00;
      --orange-hover: #d15100;
      --orange-light: #fff3ec;
      --green: #107c41;
      --green-light: #e8f5ed;
      --red: #c5221f;
      --red-light: #fde8e8;
      --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(23, 33, 43, 0.07);
      --shadow-lg: 0 12px 30px rgba(23, 33, 43, 0.12);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. TYPOGRAPHY & FORM CONTROLS
       ========================================================================== */
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    button:focus-visible, 
    input:focus-visible, 
    select:focus-visible, 
    textarea:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 1px;
    }

    /* Button Variants */
    .primary {
      background: var(--orange);
      color: #fff;
    }
    .primary:hover {
      background: var(--orange-hover);
    }
    .secondary {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .secondary:hover {
      background: #f8fafc;
      border-color: #ccd5df;
    }
    .dark {
      background: var(--ink);
      color: #fff;
    }
    .dark:hover {
      background: #253342;
    }
    .danger {
      color: var(--red);
      background: var(--red-light);
      border: 1px solid #f8b4b4;
    }
    .danger:hover {
      background: #fbd5d5;
    }
    .small {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .whatsapp-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      min-width: 31px;
      padding: 6px;
      color: #128c4a;
      background: #e8f8ef;
      border: 1px solid #b9e8cb;
    }
    .whatsapp-icon-button:hover { background: #d5f4e1; }
    .whatsapp-icon-button svg { display: block; width: 18px; height: 18px; }

    /* Form Fields */
    .formgrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .field input, 
    .field select, 
    .field textarea,
    .filters input, 
    .filters select {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      background: var(--surface);
      color: var(--ink);
      width: 100%;
      min-width: 0;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus, 
    .field select:focus, 
    .field textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(230, 92, 0, 0.12);
      outline: none;
    }

    .field textarea {
      resize: vertical;
      min-height: 75px;
    }

    .field input[readonly],
    .field select:disabled {
      background: #f8fafc;
      color: var(--muted);
      cursor: not-allowed;
    }

    .span2 { grid-column: span 2; }
    .span3 { grid-column: span 3; }
    .span4 { grid-column: 1 / -1; }

    /* ==========================================================================
       3. APP LAYOUT & SIDEBAR
       ========================================================================== */
    body:not(.authenticated) .app { display: none; }
    .auth-gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }
    .auth-card {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 28px;
    }
    .auth-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .auth-card p { color: var(--muted); margin-bottom: 20px; }
    .auth-card label { display: block; margin: 12px 0 6px; font-size: 13px; font-weight: 600; }
    .auth-card input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
    .auth-error { color: var(--red); font-size: 12px; min-height: 18px; margin-top: 10px; }
    .auth-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .auth-actions button { flex: 1; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
    }

    .sidebar {
      background: var(--ink);
      color: #fff;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px 12px;
      border-bottom: 1px solid #233140;
    }

    .brandmark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--orange);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 19px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(230, 92, 0, 0.35);
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.3px;
    }

    .brand small {
      color: #8f9da9;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: block;
    }

    .navlabel {
      color: #6d7d8d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      padding: 0 10px;
      margin-bottom: -10px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav button {
      background: transparent;
      color: #b0bdc8;
      text-align: left;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
    }

    .nav button:hover {
      background: #233140;
      color: #fff;
    }

    .nav button.active {
      background: #233140;
      color: #fff;
      box-shadow: inset 3.5px 0 0 var(--orange);
    }

    .nav .ico {
      width: 18px;
      text-align: center;
      font-size: 15px;
      opacity: 0.9;
    }

    .sidefoot {
      margin-top: auto;
      padding: 12px;
      border: 1px solid #283747;
      border-radius: var(--radius-md);
      color: #92a2b0;
      font-size: 11.5px;
      line-height: 1.4;
      background: #141d26;
    }

    .sidefoot strong {
      display: block;
      color: #fff;
      margin-bottom: 2px;
      font-size: 12px;
    }

    /* ==========================================================================
       4. TOPBAR & MAIN CONTENT
       ========================================================================== */
    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .crumb {
      font-weight: 800;
      font-size: 17px;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    .topright {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--orange-light);
      color: var(--orange);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 12px;
    }

    .content {
      padding: 24px 28px 40px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .pagehead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .pagehead h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 3px;
      color: var(--ink);
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
    }

    /* ==========================================================================
       5. DASHBOARD STAT CARDS
       ========================================================================== */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .stat .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .stat .value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin: 6px 0 2px;
      color: var(--ink);
    }

    .stat .note {
      color: var(--muted-light);
      font-size: 11.5px;
    }

    /* ==========================================================================
       6. PANELS & TABLES
       ========================================================================== */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .panelhead {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: #fafbfc;
    }

    .panelhead h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .panelbody {
      padding: 20px;
    }

    .tablewrap {
      overflow-x: auto;
      width: 100%;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      white-space: nowrap;
    }

    th {
      text-align: left;
      background: #f8fafc;
      color: #556371;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line-subtle);
      font-size: 13.5px;
      font-weight: 400;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #f9fbfd;
    }

    .money {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .muted { color: var(--muted); }
    
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--green-light);
      color: var(--green);
    }

    .badge.draft {
      background: #fff6db;
      color: #926409;
    }

    .badge.cancelled {
      background: var(--red-light);
      color: var(--red);
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .empty {
      text-align: center;
      padding: 44px 20px;
      color: var(--muted);
    }

    .empty b {
      display: block;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 6px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filters input, .filters select {
      max-width: 100%;
      width: auto;
      min-width: 150px;
    }

    /* Section Subtitle */
    .sectiontitle {
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .sectiontitle:before {
      content: '';
      width: 4px;
      height: 15px;
      background: var(--orange);
      border-radius: 2px;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 22px 0;
    }

    /* ==========================================================================
       7. INVOICE ITEMS TABLE & TOTALS BOX
       ========================================================================== */
    .items-table input, 
    .items-table select {
      width: 100%;
      min-width: 65px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }

    .items-table .desc { min-width: 200px; }
    .items-table .hsn { min-width: 90px; }
    .items-table .qty { min-width: 80px; }
    .items-table .unit { min-width: 85px; }
    .items-table .rate { min-width: 100px; }
    .items-table .gst { min-width: 90px; }

    .totals {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .totalsbox {
      width: min(100%, 390px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      background: #fafbfc;
    }

    .totalrow {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 6px 0;
      color: #556371;
      font-size: 14px;
      font-weight: 600;
    }

    .totalrow strong {
      color: var(--ink);
    }

    .totalrow.grand {
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .totalrow.grand strong {
      font-size: 16px;
      font-weight: 700;
      color: var(--orange);
    }

    .formactions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: #fafbfc;
      border-top: 1px solid var(--line);
    }

    .leftactions, .rightactions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .notice {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: #fff9ea;
      border: 1px solid #f6e2b1;
      color: #7b5b15;
      font-size: 12px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-note {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 50;
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-width: 360px;
      display: none;
      font-size: 12px;
      font-weight: 600;
    }

    .toast.show {
      display: block;
      animation: toastFade 0.2s ease-out;
    }

    @keyframes toastFade {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .hidden { display: none !important; }

    /* Modal Backdrop */
    .modalback {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.55);
      backdrop-filter: blur(2px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: min(480px, 100%);
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }

    .modal h3 {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .modalactions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .smalltext {
      font-size: 11px;
      color: var(--muted);
    }

    .logo-preview {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 4px;
      background: #fafafa;
    }

    /* ==========================================================================
       8. RESPONSIVE DESIGN
       ========================================================================== */
    @media (max-width: 1050px) {
      .app { grid-template-columns: 210px 1fr; }
      .content { padding: 20px 16px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .formgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { padding: 0 16px; }
    }

    @media (max-width: 720px) {
      .app { display: block; }
      .sidebar {
        padding: 12px;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .brand { padding: 0 4px 8px; }
      .brandmark { width: 34px; height: 34px; font-size: 16px; }
      .brand h1 { font-size: 14px; }
      .sidebar .navlabel, .sidefoot { display: none; }
      .nav {
        flex-direction: row;
        overflow-x: auto;
        gap: 6px;
        padding-bottom: 4px;
      }
      .nav button {
        white-space: nowrap;
        padding: 8px 11px;
        font-size: 12px;
        gap: 6px;
      }
      .topbar {
        height: 52px;
        position: static;
        padding: 0 14px;
      }
      .topright span:not(#sync-badge) { display: none; }
      .content { padding: 16px 12px; }
      .pagehead h2 { font-size: 20px; }
      .cards { gap: 10px; }
      .stat { padding: 14px; }
      .stat .value { font-size: 20px; }
      .formgrid { grid-template-columns: 1fr; }
      .span2, .span3, .span4 { grid-column: auto; }
      .panelbody, .panelhead, .formactions { padding: 14px; }
      .leftactions, .rightactions { width: 100%; }
      .formactions button { flex: 1; }
      .totalsbox { width: 100%; }
    }

    @media print {
      body { background: #fff !important; }
      .sidebar, .topbar, .toast, .modalback, .no-print { display: none !important; }
      .app { display: block; }
      .content { padding: 0; max-width: none; }
    }
  </style>
</head>

<body>
  <section class="auth-gate" id="auth-gate" aria-labelledby="auth-title">
    <form class="auth-card" id="auth-form">
      <h1 id="auth-title">Royal Sanitation</h1>
      <p>Sign in to access the GST Invoice Manager.</p>
      <label for="auth-email">Email address</label>
      <input id="auth-email" name="email" type="email" autocomplete="username" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
      <div class="auth-error" id="auth-error" role="alert"></div>
      <div class="auth-actions">
        <button class="primary" id="auth-submit" type="submit">Sign In</button>
        <button class="secondary" id="auth-reset" type="button">Reset Password</button>
      </div>
      <p style="font-size:11px;margin:16px 0 0">Account creation is disabled in this app. Create the owner account through Firebase Console.</p>
    </form>
  </section>
  <div class="app">
    <!-- ======================================================================
         SIDEBAR NAVIGATION
         ====================================================================== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brandmark">R</div>
        <div>
          <h1>ROYAL SANITATION</h1>
          <small>GST INVOICE MANAGER</small>
        </div>
      </div>

      <div class="navlabel">WORKSPACE</div>
      <nav class="nav" id="nav">
        <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
        <button data-page="create"><span class="ico">＋</span>Create Invoice</button>
        <button data-page="invoices"><span class="ico">▤</span>All Invoices</button>
        <button data-page="parties"><span class="ico">♙</span>Customers / Parties</button>
        <button data-page="products"><span class="ico">▣</span>Products / Items</button>
        <button data-page="settings"><span class="ico">⚙</span>Business Settings</button>
      </nav>

    </aside>

    <!-- ======================================================================
         MAIN CONTENT AREA
         ====================================================================== -->
    <main class="main">
      <header class="topbar">
        <div class="crumb" id="crumb">Dashboard</div>
        <div class="topright">

        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        if (marker) script.dataset.appSdk = marker;
        script.onload = () => { script.dataset.loaded = 'true'; resolve(); };

    // Official 2-digit Indian State Codes for GST compliance

    const DEFAULTS = {

        bankName: '',

      },
      invoices: [],

      // Tombstones: IDs of records deleted on any device, so a stale device can't resurrect them during sync.
      deleted: { invoices: [], parties: [], products: [] },

    function normalizeDeleted(d) {
      const out = { invoices: [], parties: [], products: [] };
      ['invoices', 'parties', 'products'].forEach(k => {
        out[k] = Array.isArray(d && d[k]) ? d[k].map(String) : [];

    function markDeleted(kind, id) {
      if (!id) return;
      if (!db.deleted) db.deleted = normalizeDeleted();
      if (!db.deleted[kind]) db.deleted[kind] = [];
      if (!db.deleted[kind].includes(String(id))) db.deleted[kind].push(String(id));

    /* ==========================================================================
       SECTION 2: APPLICATION STATE & PERSISTENCE
       ========================================================================== */
    let db = loadDB();
    let currentPage = 'dashboard';
    let editingId = null;
    let toastTimer = null;
    let modalResolver = null;
    let invoiceDraft = null;

    /** Load database from localStorage with schema fallback */
    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULTS);
        const data = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULTS),
          ...data,
          settings: {
            ...DEFAULTS.settings,
            ...(data.settings || {})

          deleted: normalizeDeleted(data.deleted),

    /** Save locally immediately; serialize cloud writes to avoid out-of-order writes from this tab. */
    function saveDB() {
      _dbRevision += 1;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (err) {
        notify('Could not save locally. Browser storage may be full; export a backup before continuing.');
        return false;
      }

      _setSyncBadge('saving');
      _savesInFlight += 1;
      try { localStorage.setItem(PENDING_KEY, '1'); } catch (e) {}
      queueCloudOperation(async () => {
        await initFirebase();
        if (!_auth || !_auth.currentUser) throw new Error('Sign in is required before cloud data can be saved.');
        // Snapshot at execution time, not enqueue time, so earlier sync merges are not overwritten by stale snapshots.
        const snapshot = cloudPayload();
        const sentDeleted = normalizeDeleted(db.deleted);
        await _cloudDoc.set(snapshot);
        // Deleted records are now truly gone from the database; drop the delete markers we just synced.
        ['invoices', 'parties', 'products'].forEach(k => {
          const sent = new Set(sentDeleted[k]);
          db.deleted[k] = (db.deleted[k] || []).filter(id => !sent.has(String(id)));
        });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
      }).then(() => {
        _savesInFlight = Math.max(0, _savesInFlight - 1);
        if (_savesInFlight === 0) {
          try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
          _setSyncBadge('synced');
        }
      }).catch(err => {
        _savesInFlight = Math.max(0, _savesInFlight - 1);
        console.error('Cloud save failed:', err);
        _setSyncBadge('offline');
        notify('Could not save to the cloud. Check your internet connection and try again.');
      });

    }

    /** What gets stored in the cloud: all live data, with no delete markers, so deleted records leave no trace. */
    function cloudPayload() {
      const copy = JSON.parse(JSON.stringify(db));
      copy.deleted = { invoices: [], parties: [], products: [] };
      return copy;
    }

    /** Replace local data with the cloud copy (the cloud is the source of truth). */
    function applyCloudData(c) {
      db = {
        ...structuredClone(DEFAULTS),
        ...c,
        settings: { ...DEFAULTS.settings, ...(c.settings || {}) },
        invoices: Array.isArray(c.invoices) ? c.invoices : [],
        parties: Array.isArray(c.parties) ? c.parties : [],
        products: Array.isArray(c.products) ? c.products : [],
        deleted: normalizeDeleted(),
        seq: Number(c.seq || c.settings?.nextNumber || DEFAULTS.seq)
      };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
    }

    function hasPendingLocalChanges() {
      try { return localStorage.getItem(PENDING_KEY) === '1'; } catch (e) { return false; }
    }

    /** Live listener: a change made on any device shows up on all other devices immediately. */
    function startLiveSync() {
      if (_unsubscribeLive || !_cloudDoc) return;
      _unsubscribeLive = _cloudDoc.onSnapshot(snap => {
        if (!snap.exists || snap.metadata.hasPendingWrites || _savesInFlight > 0 || hasPendingLocalChanges()) return;
        applyCloudData(snap.data() || {});
        _setSyncBadge('synced');
        const formDirty = currentPage === 'create' && document.getElementById('invoice-form')?.dataset.dirty === '1';
        const editorOpen = ['party-editor', 'product-editor'].some(id => (document.getElementById(id)?.innerHTML || '').trim());
        if (formDirty || editorOpen) notify('Data was updated from another device.');
        else render();
      }, err => {
        console.error('Live sync error:', err);
        _setSyncBadge('offline');
      });
    }

    function stopLiveSync() {
      if (_unsubscribeLive) { _unsubscribeLive(); _unsubscribeLive = null; }
    }

    /** Update the cloud sync status badge */
    function _setSyncBadge(status) {
      const el = document.getElementById('sync-badge');
      if (!el) return;
      if (status === 'saving') {
        el.textContent = '⟳ Saving…';
        el.style.background = '#fffbe6';
        el.style.color = '#b45309';
      } else if (status === 'synced') {

        el.style.color = 'var(--green)';
      } else if (status === 'offline') {

      } else if (status === 'connecting') {

        el.style.color = 'var(--muted)';
      }

    /** Merge record arrays by ID. Cloud wins on conflicts unless local data changed during startup sync. */
    function mergeRecords(cloudRecords, localRecords, localWins, deletedIds = []) {
      const result = new Map();
      const gone = new Set((deletedIds || []).map(String));
      const keyFor = (item, index, source) => String(item && item.id ? item.id : `${source}-${index}-${item && (item.number || item.name || item.description) || ''}`);
      (Array.isArray(cloudRecords) ? cloudRecords : []).forEach((item, i) => {
        if (item && item.id && gone.has(String(item.id))) return;
        result.set(keyFor(item, i, 'cloud'), item);
      });
      (Array.isArray(localRecords) ? localRecords : []).forEach((item, i) => {
        if (item && item.id && gone.has(String(item.id))) return;
        const key = keyFor(item, i, 'local');
        if (localWins || !result.has(key)) result.set(key, item);
      });
      return Array.from(result.values());
    }

    /** Startup sync: preserve local-only records and avoid overwriting newer local edits made while loading. */
    async function syncFromCloud() {
      const revisionAtStart = _dbRevision;
      _setSyncBadge('connecting');
      try {
        await queueCloudOperation(async () => {
          await initFirebase();
          if (!_auth || !_auth.currentUser) throw new Error('Sign in is required before cloud data can be loaded.');
          const snap = await _cloudDoc.get();
          if (!snap.exists) {
            await _cloudDoc.set(cloudPayload());
            _setSyncBadge('synced');
            return;
          }

          const cloudData = snap.data() || {};
          // Normal case: this device has no unsent changes, so the cloud copy is the truth.
          // This removes anything deleted elsewhere and never creates duplicates.
          if (!hasPendingLocalChanges() && _dbRevision === revisionAtStart) {
            applyCloudData(cloudData);
            // One-time cleanup of old delete markers still stored in the cloud document.
            const old = normalizeDeleted(cloudData.deleted);
            if (old.invoices.length || old.parties.length || old.products.length) {
              await _cloudDoc.set(cloudPayload());
            }
            _setSyncBadge('synced');
            render();
            return;
          }
          const localWins = _dbRevision !== revisionAtStart;
          const localData = db;
          const cloudSeq = Number(cloudData.seq || cloudData.settings?.nextNumber || DEFAULTS.seq);
          const localSeq = Number(localData.seq || localData.settings?.nextNumber || DEFAULTS.seq);
          const cloudDel = normalizeDeleted(cloudData.deleted);
          const localDel = normalizeDeleted(localData.deleted);
          const unionDel = {};
          ['invoices', 'parties', 'products'].forEach(k => {
            unionDel[k] = Array.from(new Set([...cloudDel[k], ...localDel[k]]));
          });
          db = {
            ...structuredClone(DEFAULTS),
            ...cloudData,
            settings: {
              ...DEFAULTS.settings,
              ...(cloudData.settings || {}),
              ...(localWins ? (localData.settings || {}) : {})
            },
            invoices: mergeRecords(cloudData.invoices, localData.invoices, localWins, unionDel.invoices),
            parties: mergeRecords(cloudData.parties, localData.parties, localWins, unionDel.parties),
            products: mergeRecords(cloudData.products, localData.products, localWins, unionDel.products),
            deleted: unionDel,
            seq: Math.max(cloudSeq, localSeq)
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          const hasLocalOnly = (localRecords, cloudRecords, kind) => {
            const cloudIds = new Set((Array.isArray(cloudRecords) ? cloudRecords : []).map(x => String(x && x.id || '')));
            const gone = new Set(unionDel[kind]);
            return (Array.isArray(localRecords) ? localRecords : []).some(x => x && x.id && !cloudIds.has(String(x.id)) && !gone.has(String(x.id)));
          };
          const tombstonesChanged = ['invoices', 'parties', 'products'].some(k => unionDel[k].length !== cloudDel[k].length);
          const needsCloudWrite = localWins || tombstonesChanged ||
            hasLocalOnly(localData.invoices, cloudData.invoices, 'invoices') ||
            hasLocalOnly(localData.parties, cloudData.parties, 'parties') ||
            hasLocalOnly(localData.products, cloudData.products, 'products') || localSeq > cloudSeq;
          if (needsCloudWrite) {
            await _cloudDoc.set(cloudPayload());
            db.deleted = normalizeDeleted();
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
          }
          _setSyncBadge('synced');
          render();
        });
      } catch (err) {
        console.error('Cloud sync error:', err);
        _setSyncBadge('offline');
      }
      startLiveSync();
    }

    /* ==========================================================================
       SECTION 3: UTILITY & FORMATTING FUNCTIONS
       ========================================================================== */
    /** Sanitize HTML entities to prevent XSS */
    function esc(val = '') {
      return String(val ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }


    /** Permit only image data URLs and HTTPS logo URLs in image attributes. */
    function safeImageSrc(value = '') {
      const src = String(value || '').trim();
      if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(src)) return src;
      if (/^https:\/\//i.test(src)) return src;
      return '';
    }

    /** Capitalize the first letter of each word (Title Case) */
    function titleCase(val = '') {
      if (!val) return '';
      return String(val)
        .split(' ')
        .map(word => {
          if (!word) return '';
          // Keep common uppercase acronyms intact if they are already 2-4 uppercase letters
          if (/^[A-Z0-9]{2,4}$/.test(word)) return word;
          return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
        })
        .join(' ');
    }

    /** Convert input to valid finite number */
    function num(val) {
      const n = Number(val);
      return Number.isFinite(n) ? n : 0;
    }

    /** Round number to 2 decimal places */
    function round2(val) {
      return Math.round((num(val) + Number.EPSILON) * 100) / 100;
    }

    /** Format number with Indian comma separators without currency prefix */
    function moneyRaw(val) {
      return Number(val || 0).toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    /** Format number as Indian Currency (e.g. ₹ 1,23,456.78) */
    function money(val) {
      return '₹ ' + moneyRaw(val);
    }

    /** Format date string YYYY-MM-DD into readable DD-Mon-YY (e.g. 17-Sep-26) matching Tally style */
    function fmtTallyDate(str) {
      if (!str) return '—';
      const d = new Date(str + 'T12:00:00');
      if (Number.isNaN(d.getTime())) return str;
      const day = String(d.getDate()).padStart(2, '0');
      const month = d.toLocaleString('en-US', { month: 'short' });
      const year = String(d.getFullYear()).slice(-2);
      return `${day}-${month}-${year}`;
    }

    function fmtDate(str) {
      if (!str) return '—';
      const d = new Date(str + 'T12:00:00');
      return Number.isNaN(d.getTime()) ? str : d.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
    }

    /** Get 2-digit GST state code from state name */
    function codeFor(stateName) {
      const found = STATES.find(s => s[0] === stateName);
      return found ? found[1] : '';
    }

    /** Generate HTML options for Indian state select dropdown */
    function stateOptions(selectedState = '') {
      return '<option value="">Select State</option>' +
        STATES.map(s => `<option value="${esc(s[0])}" ${s[0] === selectedState ? 'selected' : ''}>${esc(s[0])} (${s[1]})</option>`).join('');
    }

    /** Calculate Indian Financial Year (e.g. 2026-27) */
    function currentFY(date = new Date()) {
      let year = date.getFullYear();
      if (date.getMonth() < 3) year--;
      return `${year}-${String(year + 1).slice(-2)}`;
    }

    /** Generate auto-incrementing invoice number */
    function generateInvoiceNumber(dateValue) {
      const d = dateValue ? new Date(dateValue + 'T12:00:00') : new Date();
      const prefix = db.settings.prefix.trim();
      const seqVal = db.settings.nextNumber || db.seq || 329;
      if (db.settings.financialYear) {
        const fy = currentFY(d);
        return `${prefix ? prefix + '/' : ''}${fy}/${String(seqVal).padStart(4, '0')}`;
      }
      return `${prefix ? prefix + '/' : ''}${seqVal}`;
    }

    /** Display temporary notification toast */
    function notify(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    /** Modal Confirmation Box returning a Promise */
    function confirmBox(title, message, okText = 'Confirm') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      document.getElementById('modal-ok').textContent = okText;
      document.getElementById('modalback').classList.remove('hidden');
      return new Promise(resolve => {
        modalResolver = resolve;
      });
    }

    function closeModal(result) {
      document.getElementById('modalback').classList.add('hidden');
      if (modalResolver) modalResolver(result);
      modalResolver = null;
    }

    document.getElementById('modal-cancel').onclick = () => closeModal(false);
    document.getElementById('modal-ok').onclick = () => closeModal(true);
    document.getElementById('modalback').addEventListener('click', e => {
      if (e.target.id === 'modalback') closeModal(false);
    });

    /** Convert numerical amount into Indian currency words in Tally INR format */
    function numberWordsINR(amount) {
      const n = num(amount);
      if (n <= 0) return 'INR Zero Only';

      const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
                    'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      function chunkToWords(x) {
        let str = '';
        if (x >= 100) {
          str += ones[Math.floor(x / 100)] + ' Hundred ';
          x %= 100;
        }
        if (x >= 20) {
          str += tens[Math.floor(x / 10)] + ' ';
          x %= 10;
        }
        if (x > 0) {
          str += ones[x] + ' ';
        }
        return str;
      }

      const intPart = Math.floor(n);
      const decPart = Math.round((n - intPart) * 100);

      let x = intPart;
      let words = '';

      const units = [
        [10000000, 'Crore'],
        [100000, 'Lakh'],
        [1000, 'Thousand'],
        [1, '']
      ];

      for (const [unitValue, unitName] of units) {
        if (x >= unitValue) {
          const q = Math.floor(x / unitValue);
          words += chunkToWords(q) + unitName + ' ';
          x %= unitValue;
        }
      }

      let result = 'INR ' + words.trim();
      if (decPart > 0) {
        result += ' and ' + chunkToWords(decPart).trim() + ' Paise';
      }
      return result + ' Only';
    }

    /** Create blank invoice item object */
    function blankItem() {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        description: '',
        hsn: '',
        qty: 1,
        unit: 'pcs',
        rate: 0,
        gstRate: 18
      };
    }

    /* ==========================================================================
       SECTION 4: TAX & CALCULATION ENGINE
       ========================================================================== */
    /** Calculate individual item line totals */
    function calcItem(item, discountFactor = 1) {
      const taxable = round2(num(item.qty) * num(item.rate) * discountFactor);
      const gst = round2(taxable * num(item.gstRate) / 100);
      return {
        ...item,
        taxable,
        gst,
        lineTotal: round2(taxable + gst)
      };
    }

    /** Apply the fixed 18% GST rate and split it by the buyer's place of supply. */
    function calculateInvoice() {
      const form = document.getElementById('invoice-form');
      if (!form || !invoiceDraft) return null;

      const partyState = document.getElementById('party-state')?.value || '';
      const supplierState = 'Madhya Pradesh';
      const isIntraState = partyState === supplierState;

      const items = invoiceDraft.items || [];
      const gross = items.reduce((sum, it) => sum + (num(it.qty) * num(it.rate)), 0);

      const discount = Math.max(0, num(document.getElementById('discount')?.value));
      const discountMode = document.getElementById('discount-mode')?.value || 'before';

      const discountFactor = (discountMode === 'before' && gross > 0)
        ? Math.max(0, (gross - Math.min(discount, gross)) / gross)
        : 1;

      let taxable = 0;
      let cgst = 0;
      let sgst = 0;
      let igst = 0;

      const calculatedItems = items.map(it => {
        const itemCalc = calcItem({ ...it, gstRate: 18 }, discountFactor);
        taxable += itemCalc.taxable;

        if (isIntraState) {
          itemCalc.cgst = round2(itemCalc.gst / 2);
          itemCalc.sgst = round2(itemCalc.gst - itemCalc.cgst);
          itemCalc.igst = 0;
          cgst += itemCalc.cgst;
          sgst += itemCalc.sgst;
        } else {
          itemCalc.cgst = 0;
          itemCalc.sgst = 0;
          itemCalc.igst = itemCalc.gst;
          igst += itemCalc.igst;
        }
        return itemCalc;
      });

      taxable = round2(taxable);
      cgst = round2(cgst);
      sgst = round2(sgst);
      igst = round2(igst);

      const totalGst = round2(cgst + sgst + igst);
      const otherCharges = Math.max(0, num(document.getElementById('other-charges')?.value));
      const afterTaxDiscount = (discountMode === 'after') ? discount : 0;
      const roundOffVal = num(document.getElementById('round-off')?.value);

      const grandTotalPreRound = taxable + totalGst + otherCharges - afterTaxDiscount;
      const grandTotal = round2(Math.max(0, grandTotalPreRound + roundOffVal));

      // Update Totals Box in UI
      const totalsBox = document.getElementById('totals-box');
      if (totalsBox) {
        totalsBox.innerHTML = `
          <div class="totalrow">
            <span>Taxable Value</span>
            <strong>${money(taxable)}</strong>
          </div>
          ${isIntraState ? `
            <div class="totalrow"><span>CGST</span><strong>${money(cgst)}</strong></div>
            <div class="totalrow"><span>SGST</span><strong>${money(sgst)}</strong></div>
          ` : `
            <div class="totalrow"><span>IGST</span><strong>${money(igst)}</strong></div>
          `}
          <div class="totalrow">
            <span>Total GST</span>
            <strong>${money(totalGst)}</strong>
          </div>
          ${discount > 0 ? `
            <div class="totalrow">
              <span>Discount (${discountMode === 'after' ? 'After GST' : 'Before GST'})</span>
              <strong style="color:var(--green)">− ${money(discount)}</strong>
            </div>
          ` : ''}
          ${otherCharges > 0 ? `
            <div class="totalrow">
              <span>Cartage &amp; Forwarding</span>
              <strong>+ ${money(otherCharges)}</strong>
            </div>
          ` : ''}
          <div class="totalrow">
            <span>Round-off Adjustment</span>
            <strong>${roundOffVal >= 0 ? '+' : ''}${money(roundOffVal)}</strong>
          </div>
          <div class="totalrow grand">
            <span>Grand Total</span>
            <strong>${money(grandTotal)}</strong>
          </div>
          <div class="smalltext" style="margin-top:8px">
            Tax Regime: <b>${isIntraState ? 'Intra-State (CGST + SGST)' : 'Inter-State (IGST)'}</b>
            <br>Supplier State: ${esc(supplierState)} (${codeFor(supplierState)})
          </div>
        `;
      }

      return {
        items: calculatedItems,
        taxable,
        cgst,
        sgst,
        igst,
        totalGst,
        discount,
        discountMode,
        otherCharges,
        roundOff: roundOffVal,
        grandTotal,
        intra: isIntraState
      };
    }

    /** Refresh calculation displays on input changes */
    function refreshCalc() {
      const result = calculateInvoice();
      if (!result) return;

      document.querySelectorAll('#items-body tr').forEach((tr, idx) => {
        const itemData = result.items[idx];
        if (!itemData) return;
        tr.querySelector('.item-taxable').textContent = money(itemData.taxable);
        tr.querySelector('.item-gst').textContent = money(itemData.gst);
        tr.querySelector('.item-total').textContent = money(itemData.lineTotal);
      });
    }

    /** Validate GSTIN format and state code matching */
    function gstinWarning() {
      const gstin = (document.getElementById('party-gstin')?.value || '').trim().toUpperCase();
      const state = document.getElementById('party-state')?.value || '';
      const warningEl = document.getElementById('gstin-warning');
      if (!warningEl) return;

      const expectedCode = codeFor(state);

      if (gstin && gstin.length === 15) {
        const gstRegex = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
        if (!gstRegex.test(gstin)) {
          warningEl.textContent = '⚠️ GSTIN format looks invalid. Please verify the 15-character string.';
          warningEl.style.color = 'var(--red)';
          return;
        }
      }
      
      if (gstin && gstin.length >= 2 && expectedCode && gstin.slice(0, 2) !== expectedCode) {
        warningEl.textContent = `⚠️ GSTIN State Code (${gstin.slice(0, 2)}) doesn't match selected State Code (${expectedCode}).`;
        warningEl.style.color = 'var(--red)';
        return;
      }

      warningEl.textContent = '';
    }

    /** Open print-ready formatted GST Tax Invoice matching user's exact Tally layout */
    /** Generate standardized invoice filename: INV - XXX(Invoice no.) - Hasan Dharwala (Party Name), Indore ( City) */
    function getInvoiceFileName(inv) {
      const invNo = String(inv.number || '001').replace(/[\\/:*?"<>|]/g, '-').trim();
      const party = titleCase(inv.partyName || 'Customer').replace(/[\\/:*?"<>|]/g, '-').trim();

      let rawCity = inv.city;
      if (!rawCity && inv.address) {
        const parts = inv.address.split(',').map(s => s.trim()).filter(Boolean);
        rawCity = parts[parts.length - 1];
      }
      const city = titleCase(rawCity || 'Indore').replace(/[\\/:*?"<>|]/g, '-').trim();
      return `INV - ${invNo} - ${party}, ${city}`;
    }

    /** Generate standalone print-ready HTML for the invoice */
    /** Supplier details for an invoice. Tax identity (GSTIN, legal name) stays as frozen on the invoice;
        address, contact details, logo and QR always follow the current Business Settings. */
    function invoiceSupplier(inv) {
      const live = db.settings || {};
      const snap = (inv && inv.supplierSnapshot) || {};
      const out = { ...live, ...snap };
      Object.keys(live).forEach(k => {
        if (snap[k] === undefined || snap[k] === null || snap[k] === '') out[k] = live[k];
      });
      ['address', 'city', 'pincode', 'phone', 'whatsapp', 'email', 'website', 'qr', 'logo'].forEach(k => {
        if (live[k]) out[k] = live[k];
      });
      return out;
    }

    /** Full Registered Business Address, line by line, exactly as typed in Business Settings. */
    function supplierAddressLines(s) {
      const lines = String((s && s.address) || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const all = lines.join(' ').toLowerCase();
      const extra = [];
      const city = String((s && s.city) || '').trim();
      const pin = String((s && s.pincode) || '').trim();
      if (city && !all.includes(city.toLowerCase())) extra.push(city);
      if (pin && !all.includes(pin)) extra.push(pin);
      if (extra.length) lines.push(extra.join(' - '));
      // one single line: address parts and city together
      const oneLine = lines.map(l => l.replace(/[,\s]+$/, '')).filter(Boolean).join(', ');
      return oneLine ? [oneLine] : [];
    }

    /** One contact line for under the firm name: phone, WhatsApp (if different) and email. */
    function supplierContactLine(s) {
      const phone = String((s && s.phone) || '').trim();
      const wa = String((s && s.whatsapp) || '').trim();
      const email = String((s && s.email) || '').trim();
      const last10 = v => String(v).replace(/\D/g, '').slice(-10);
      const parts = [];
      if (phone) parts.push('Ph: ' + phone);
      if (wa && last10(wa) !== last10(phone)) parts.push('WhatsApp: ' + wa);
      if (email) parts.push('Email: ' + email);
      return parts.join('  |  ');
    }
